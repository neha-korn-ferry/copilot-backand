openapi: 3.0.0
info:
  title: Copilot Test API's
  version: 1.0.0
  description: API documentation for your Node.js app

servers:
  - url: `${process.env.BASE_URL}/api`  

tags:
  - name: Auth
    description: Authentication related routes
  - name: Copilot
    description: Copilot-related endpoints (test, participant-summary)

paths:
  /auth/generate-token:
    post:
      tags:
        - Auth
      summary: Generate a new JWT token
      description: Generate a token for a valid user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid username or password

  /copilot/hello:
    get:
      tags:
        - Copilot
      summary: Return a hello message (Protected Route)
      description: Requires a valid JWT token to access.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful hello message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello, world!
        '401':
          description: Unauthorized (invalid or missing token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token missing or invalid

  /copilot/participant-summary:
    get:
      tags:
        - Copilot
      summary: Get assigned participants for coach
      description: Coaches can call this API with SSO token to get their assigned participants.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response with assigned participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  coach:
                    type: string
                    example: coach123
                  participants:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: p1
                        name:
                          type: string
                          example: John Doe
                        assignedTo:
                          type: string
                          example: coach123
        '401':
          description: Unauthorized (invalid or missing token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token missing or invalid

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT